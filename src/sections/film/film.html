<!-- Campus film: the hero film card lifts into a full-screen frame on scroll -->
<section class="film-scroll" id="film" aria-label="Campus film">
    <div class="film-sticky">
      <div class="stage-bg" aria-hidden="true"></div>
      <canvas class="stage-warp" aria-hidden="true"></canvas>
      <div class="flyer">
        <video muted playsinline preload="auto" data-loop-to="2.6" data-rate="0.55"
          poster="https://ssb-school-concept.vercel.app/media/campus-film-poster.jpg"
          src="https://ssb-school-concept.vercel.app/media/campus-film.mp4"></video>
        <div class="flyer-shade"></div>
        <div class="flyer-copy">
          <div><p class="fc-eyebrow">The campus film</p><h2 class="fc-title">Learn business by doing business.</h2></div>
          <button class="fc-sound" type="button"><i><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3.5v9l7.5-4.5z"/></svg></i>Watch with sound · 0:15</button>
        </div>
      </div>
    </div>
  </section>
