<!doctype html><html><body style="margin:0;background:#222;overflow:hidden">
<iframe id="f" style="border:0;display:block;transform-origin:0 0"></iframe>
<script>
/* Sketch harness: renders a sketch at a true width. ?p=a-ready.html&w=1440&h=900 */
var q=new URLSearchParams(location.search), w=+q.get('w')||1440, h=+q.get('h')||900, f=document.getElementById('f');
function fit(){var s=Math.min(1, innerWidth/w, innerHeight/h); f.style.width=w+'px'; f.style.height=h+'px'; f.style.transform='scale('+s+')';}
fit(); addEventListener('resize',fit);
f.src='/.sketches/'+(q.get('p')||'a-ready.html')+'?v='+Date.now();
</script></body></html>
